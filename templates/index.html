<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jargon Translator</title>
  <style>
    :root {
      --bg: #f6f5f1; --card: #ffffff; --text: #1d1d1f; --muted: #6b6b70;
      --border: #dedcd5; --accent: #2f5bea; --accent-text: #ffffff; --error: #c0392b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161618; --card: #202023; --text: #ececee; --muted: #9a9aa1;
        --border: #34343a; --accent: #6b8cff; --accent-text: #0e0e10; --error: #ff7b6b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 1100px; margin: 0 auto; padding: 32px 16px 48px; }
    h1 { margin: 0 0 4px; font-size: 28px; }
    .sub { margin: 0 0 24px; color: var(--muted); }
    .toggle {
      display: inline-flex; border: 1px solid var(--border); border-radius: 999px;
      padding: 4px; background: var(--card); margin-bottom: 16px;
    }
    .toggle button {
      border: 0; background: transparent; color: var(--text); padding: 8px 16px;
      border-radius: 999px; font: inherit; cursor: pointer;
    }
    .toggle button.active { background: var(--accent); color: var(--accent-text); }
    .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 720px) { .panes { grid-template-columns: 1fr; } }
    .pane {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px; display: flex; flex-direction: column;
    }
    .pane label { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    textarea, .output {
      width: 100%; min-height: 320px; border: 0; resize: vertical; background: transparent;
      color: var(--text); font: inherit; outline: none; white-space: pre-wrap;
    }
    .output.placeholder { color: var(--muted); }
    .actions { display: flex; gap: 12px; align-items: center; margin-top: 16px; flex-wrap: wrap; }
    .primary {
      background: var(--accent); color: var(--accent-text); border: 0; border-radius: 8px;
      padding: 10px 20px; font: inherit; font-weight: 600; cursor: pointer;
    }
    .primary:disabled { opacity: .6; cursor: wait; }
    .secondary {
      background: transparent; color: var(--text); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 16px; font: inherit; cursor: pointer;
    }
    .status { color: var(--muted); font-size: 14px; }
    .status.error { color: var(--error); }

    .gmail {
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 16px; margin-bottom: 16px;
    }
    .gmail-bar { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .gmail-bar .who { font-size: 14px; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
    .gmail-bar .who strong { color: var(--text); }
    .gmail-buttons { display: flex; gap: 8px; }
    .inbox { list-style: none; margin: 12px 0 0; padding: 0; max-height: 280px; overflow-y: auto;
             border-top: 1px solid var(--border); }
    .inbox li { border-bottom: 1px solid var(--border); }
    .inbox button {
      display: block; width: 100%; text-align: left; background: transparent; border: 0;
      color: var(--text); font: inherit; padding: 10px 4px; cursor: pointer;
    }
    .inbox button:hover, .inbox button:focus-visible { background: color-mix(in srgb, var(--accent) 10%, transparent); }
    .inbox .row1 { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
    .inbox .from { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .inbox .date { color: var(--muted); flex-shrink: 0; }
    .inbox .subject { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .inbox .snippet { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .inbox .empty { padding: 12px 4px; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
<main>
  <h1>Jargon Translator</h1>
  <p class="sub">Paste an email. Get the corporate version, or find out what it actually says.</p>

  <section class="gmail" id="gmail" hidden>
    <div class="gmail-bar">
      <span class="who" id="gmail-who">Load an email straight from Gmail (read-only).</span>
      <div class="gmail-buttons">
        <a class="primary" id="gmail-signin" href="/login" style="text-decoration:none">Sign in with Google</a>
        <button class="secondary" id="gmail-refresh" hidden>Refresh inbox</button>
        <button class="secondary" id="gmail-signout" hidden>Sign out</button>
      </div>
    </div>
    <ul class="inbox" id="inbox" hidden aria-label="Recent emails"></ul>
  </section>

  <div class="toggle" role="group" aria-label="Direction">
    <button type="button" data-dir="to_plain" class="active">Jargon → Plain English</button>
    <button type="button" data-dir="to_jargon">Plain English → Jargon</button>
  </div>

  <div class="panes">
    <div class="pane">
      <label for="input" id="input-label">Corporate jargon</label>
      <textarea id="input" placeholder="Per my last email, let's circle back EOD to align on next steps..."></textarea>
    </div>
    <div class="pane">
      <label id="output-label">Plain English</label>
      <div id="output" class="output placeholder" aria-live="polite">Your translation will appear here.</div>
    </div>
  </div>

  <div class="actions">
    <button id="go" class="primary">Translate</button>
    <button id="swap" class="secondary" title="Use the output as new input and flip direction">Swap ⇄</button>
    <button id="copy" class="secondary">Copy</button>
    <span id="status" class="status"></span>
  </div>
</main>

<script>
  const labels = { to_plain: ["Corporate jargon", "Plain English"], to_jargon: ["Plain English", "Corporate jargon"] };
  let direction = "to_plain";
  const $ = (id) => document.getElementById(id);
  const input = $("input"), output = $("output"), status = $("status"), go = $("go");

  function setDirection(dir) {
    direction = dir;
    document.querySelectorAll(".toggle button").forEach(b => b.classList.toggle("active", b.dataset.dir === dir));
    $("input-label").textContent = labels[dir][0];
    $("output-label").textContent = labels[dir][1];
  }
  document.querySelectorAll(".toggle button").forEach(b => b.addEventListener("click", () => setDirection(b.dataset.dir)));

  async function translate() {
    const text = input.value.trim();
    if (!text) { status.textContent = "Paste some text first."; status.className = "status error"; return; }
    go.disabled = true; status.className = "status"; status.textContent = "Translating…";
    try {
      const res = await fetch("/api/translate", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, direction }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Something went wrong.");
      output.textContent = data.result; output.classList.remove("placeholder");
      status.textContent = "";
    } catch (e) {
      status.textContent = e.message; status.className = "status error";
    } finally { go.disabled = false; }
  }

  go.addEventListener("click", translate);
  input.addEventListener("keydown", (e) => { if ((e.metaKey || e.ctrlKey) && e.key === "Enter") translate(); });
  $("swap").addEventListener("click", () => {
    if (output.classList.contains("placeholder")) return;
    input.value = output.textContent;
    setDirection(direction === "to_plain" ? "to_jargon" : "to_plain");
  });
  $("copy").addEventListener("click", async () => {
    if (output.classList.contains("placeholder")) return;
    try { await navigator.clipboard.writeText(output.textContent); status.className = "status"; status.textContent = "Copied!"; } catch {}
  });

  // ---------- Gmail ----------
  const gmail = $("gmail"), who = $("gmail-who"), inbox = $("inbox");
  const signin = $("gmail-signin"), refresh = $("gmail-refresh"), signout = $("gmail-signout");

  function showError(msg) { status.textContent = msg; status.className = "status error"; }

  function shortDate(raw) {
    const d = new Date(raw);
    if (isNaN(d)) return "";
    const today = new Date().toDateString() === d.toDateString();
    return today ? d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })
                 : d.toLocaleDateString([], { month: "short", day: "numeric" });
  }
  const senderName = (from) => (from.match(/^\s*"?([^"<]+?)"?\s*</) || [, from])[1].trim();

  async function loadInbox() {
    inbox.hidden = false;
    inbox.innerHTML = '<li class="empty">Loading inbox…</li>';
    try {
      const res = await fetch("/api/emails");
      const data = await res.json();
      if (!res.ok) throw new Error(data.error);
      inbox.innerHTML = "";
      if (!data.emails.length) { inbox.innerHTML = '<li class="empty">Your inbox is empty.</li>'; return; }
      for (const m of data.emails) {
        const li = document.createElement("li");
        const b = document.createElement("button");
        b.innerHTML = '<div class="row1"><span class="from"></span><span class="date"></span></div>' +
                      '<div class="subject"></div><div class="snippet"></div>';
        b.querySelector(".from").textContent = senderName(m.from);
        b.querySelector(".date").textContent = shortDate(m.date);
        b.querySelector(".subject").textContent = m.subject;
        b.querySelector(".snippet").textContent = m.snippet;
        b.addEventListener("click", () => openEmail(m.id));
        li.appendChild(b); inbox.appendChild(li);
      }
    } catch (e) {
      inbox.innerHTML = "";
      const li = document.createElement("li"); li.className = "empty"; li.textContent = e.message;
      inbox.appendChild(li);
    }
  }

  async function openEmail(id) {
    status.className = "status"; status.textContent = "Loading email…";
    try {
      const res = await fetch("/api/emails/" + encodeURIComponent(id));
      const m = await res.json();
      if (!res.ok) throw new Error(m.error);
      input.value = m.body;
      setDirection("to_plain");
      output.textContent = "Your translation will appear here."; output.classList.add("placeholder");
      status.textContent = `Loaded “${m.subject}”` + (m.truncated ? " (trimmed to 10,000 characters)" : "") + ". Click Translate.";
      input.scrollIntoView({ behavior: "smooth", block: "center" });
    } catch (e) { showError(e.message); }
  }

  async function initGmail() {
    const params = new URLSearchParams(location.search);
    if (params.get("gmail_error")) {
      showError(params.get("gmail_error") === "access_denied" ? "Google sign-in was cancelled." : "Google sign-in failed. Try again.");
      history.replaceState(null, "", "/");
    }
    try {
      const me = await (await fetch("/api/me")).json();
      if (!me.configured) return;  // Google keys not set: keep the Gmail panel hidden
      gmail.hidden = false;
      if (me.signed_in) {
        who.innerHTML = "Signed in as <strong></strong>";
        who.querySelector("strong").textContent = me.email;
        signin.hidden = true; refresh.hidden = false; signout.hidden = false;
        loadInbox();
      }
    } catch {}
  }

  refresh.addEventListener("click", loadInbox);
  signout.addEventListener("click", async () => { await fetch("/logout", { method: "POST" }); location.reload(); });
  initGmail();
</script>
</body>
</html>
